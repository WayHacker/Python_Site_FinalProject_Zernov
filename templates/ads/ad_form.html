{% extends 'base.html' %}

{% block title %}{% if object %}Редактирование{% else %}Новое объявление{% endif %}{% endblock %}

{% block content %}
    <div class="form-card">
        <h1 class="mt-0">{% if object %}Редактирование{% else %}Новое объявление{% endif %}</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'ads:list' %}" class="btn">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
