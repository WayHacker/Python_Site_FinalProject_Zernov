<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Редактирование{% else %}Новое объявление{% endif %}</title>
</head>
<body>
    <h1>{% if object %}Редактирование{% else %}Новое объявление{% endif %}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
        <a href="{% url 'ads:list' %}">Отмена</a>
    </form>
</body>
</html>
